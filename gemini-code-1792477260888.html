      { number: 77, name: '若原 智哉', pos: 'GK' },
      { number: 87, name: '山内 日向汰', pos: 'MF' },
      { number: 88, name: '馬場 晴也', pos: 'DF' }
    ];

    function App() {
      const [currentTab, setCurrentTab] = useState('calendar');
      const [selectedScheduleComp, setSelectedScheduleComp] = useState('J1');
      const [expandedMatchId, setExpandedMatchId] = useState('j1_10');
      const [currentYear, setCurrentYear] = useState(2026);
      const [currentMonth, setCurrentMonth] = useState(10);

      // 観戦トグル（ローカルストレージ保持）
      const [spectateMatchIds, setSpectateMatchIds] = useState(() => {
        const saved = localStorage.getItem('nemo_spectate_matches');
        return saved ? JSON.parse(saved) : ['levain_3', 'j1_10'];
      });

      // 掲示板（ローカルストレージ保持）
      const [posts, setPosts] = useState(() => {
        const saved = localStorage.getItem('nemo_board_posts');
        return saved ? JSON.parse(saved) : [
          { id: '1', name: '日立台Nemoサポ', text: '2027年6月までの全J1日程が更新された！カレンダー切替で2027年の試合もチェックできます！', time: '10分前', likes: 78 },
          { id: '2', name: 'レイソルファン', text: '全試合と全43選手が入っていて完璧！本日の名古屋戦全力応援します！🔥', time: '20分前', likes: 55 }
        ];
      });
      const [inputName, setInputName] = useState('');
      const [inputText, setInputText] = useState('');

      useEffect(() => {
        localStorage.setItem('nemo_spectate_matches', JSON.stringify(spectateMatchIds));
      }, [spectateMatchIds]);

      useEffect(() => {
        localStorage.setItem('nemo_board_posts', JSON.stringify(posts));
      }, [posts]);

      const toggleSpectate = (id, e) => {
        if (e) e.stopPropagation();
        setSpectateMatchIds(prev => 
          prev.includes(id) ? prev.filter(mId => mId !== id) : [...prev, id]
        );
      };

      const toggleMatchExpand = (id) => {
        setExpandedMatchId(prev => (prev === id ? null : id));
      };

      const handlePostSubmit = (e) => {
        e.preventDefault();
        if (!inputText.trim()) return;
        const newPost = {
          id: Date.now().toString(),
          name: inputName.trim() || '柏サポーター',
          text: inputText.trim(),
          time: 'たった今',
          likes: 0
        };
        setPosts([newPost, ...posts]);
        setInputText('');
      };

      const prevMonth = () => {
        if (currentMonth === 1) { setCurrentYear(currentYear - 1); setCurrentMonth(12); }
        else { setCurrentMonth(currentMonth - 1); }
      };

      const nextMonth = () => {
        if (currentMonth === 12) { setCurrentYear(currentYear + 1); setCurrentMonth(1); }
        else { setCurrentMonth(currentMonth + 1); }
      };

      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
      const firstDayOfWeek = new Date(currentYear, currentMonth - 1, 1).getDay();

      return (
        <div className="min-h-screen max-w-md mx-auto bg-black border-x border-zinc-800/80 flex flex-col pb-20 shadow-2xl">
          {/* 🔥 ヘッダー：「Nemo柏レイソル！」 */}
          <header className="reysol-bg-yellow text-black px-4 py-3 sticky top-0 z-50 shadow-2xl border-b-2 border-black flex justify-between items-center">
            <div className="flex items-center space-x-2.5">
              <div className="w-9 h-9 rounded-full bg-black text-[#FFF000] flex items-center justify-center shadow-lg border border-yellow-300">
                <i className="fa-solid fa-sun text-xl spin-sun"></i>
              </div>
              <span className="text-xl font-black italic tracking-tight text-black">
                Nemo柏レイソル！
              </span>
            </div>

            <div className="text-[11px] font-black bg-black text-[#FFF000] px-3 py-1.5 rounded-full border border-black shadow">
              観戦: <span className="text-white font-black">{spectateMatchIds.length}</span> 試合
            </div>
          </header>

          {/* HERO MATCHDAY CARD */}
          <section className="bg-zinc-950 p-3.5 border-b border-zinc-800 relative overflow-hidden">
            <div className="flex justify-between items-center mb-2">
              <span className="text-[11px] font-black tracking-widest text-[#FFF000] uppercase flex items-center">
                <i className="fa-solid fa-sun text-xs mr-1 text-[#FFF000]"></i>
                NEXT MATCH / HERO CARD
              </span>
              <span className="text-[10px] font-black text-black bg-[#FFF000] px-2 py-0.5 rounded-full">
                J1 第10節 (2026/10/17)
              </span>
            </div>

            <div className="reysol-bg-yellow text-black border-2 border-black rounded-2xl p-3.5 shadow-2xl relative overflow-hidden">
              <div className="flex justify-between items-center text-center relative z-10">
                <div className="flex-1">
                  <p className="text-sm font-black text-black">柏レイソル</p>
                  <p className="text-[10px] font-extrabold bg-black text-[#FFF000] px-1.5 py-0.5 rounded inline-block mt-1">
                    J1 首位 (勝点21)
                  </p>
                </div>

                <div className="px-2">
                  <span className="text-xs font-black text-black block tracking-wider">19:00 KO</span>
                  <span className="text-xs font-black bg-black text-[#FFF000] px-2.5 py-0.5 rounded-full mt-0.5 inline-block">
                    VS
                  </span>
                </div>

                <div className="flex-1">
                  <p className="text-sm font-black text-black">名古屋グランパス</p>
                  <p className="text-[10px] font-bold text-zinc-800 mt-1">三協F柏</p>
                </div>
              </div>

              <div className="mt-3 pt-2 border-t border-black/30 flex justify-between items-center text-xs relative z-10">
                <span className="text-[11px] font-extrabold text-black">
                  直近ACLE: <span className="underline">5 - 1 大勝 (ポートFC)</span>
                </span>
                <button
                  onClick={(e) => toggleSpectate('j1_10', e)}
                  className={`px-3 py-1 rounded-xl text-[11px] font-black transition-all flex items-center space-x-1 ${
                    spectateMatchIds.includes('j1_10')
                      ? 'bg-black text-[#FFF000] shadow-lg'
                      : 'bg-white/80 text-black border border-black'
                  }`}
                >
                  <i className="fa-solid fa-eye"></i>
                  <span>{spectateMatchIds.includes('j1_10') ? '🟡 観戦する' : '観戦に追加'}</span>
                </button>
              </div>
            </div>
          </section>

          {/* メインコンテンツ */}
          <main className="flex-1 p-3 overflow-y-auto">
            {/* --- ① 月別切替対応 カレンダー --- */}
            {currentTab === 'calendar' && (
              <div>
                <div className="flex justify-between items-center mb-3 bg-zinc-900/90 p-2.5 rounded-xl border border-zinc-800">
                  <button onClick={prevMonth} className="text-zinc-400 hover:text-[#FFF000] px-3 py-1 font-black">
                    <i className="fa-solid fa-chevron-left mr-1"></i>前月
                  </button>
                  <span className="text-sm font-black text-[#FFF000] tracking-wider">
                    {currentYear}年 {currentMonth}月
                  </span>
                  <button onClick={nextMonth} className="text-zinc-400 hover:text-[#FFF000] px-3 py-1 font-black">
                    次月<i className="fa-solid fa-chevron-right ml-1"></i>
                  </button>
                </div>

                <div className="bg-zinc-900/90 rounded-2xl p-3 border border-zinc-800/80 mb-4 shadow-xl">
                  <div className="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-zinc-500 mb-1.5">
                    <span className="text-red-400">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span className="text-blue-400">土</span>
                  </div>

                  <div className="grid grid-cols-7 gap-1">
                    {Array.from({ length: firstDayOfWeek }).map((_, idx) => (
                      <div key={`e-${idx}`} className="h-16 bg-zinc-950/40 rounded-lg"></div>
                    ))}

                    {Array.from({ length: daysInMonth }).map((_, idx) => {
                      const dayNum = idx + 1;
                      const dateStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                      const matchOnDay = season2026FullMatches.find(m => m.date === dateStr);
                      const isSpectating = matchOnDay && spectateMatchIds.includes(matchOnDay.id);

                      return (
                        <div
                          key={dateStr}
                          className={`h-16 rounded-xl p-1 border flex flex-col justify-between transition-all ${
                            matchOnDay 
                              ? (isSpectating ? 'border-[#FFF000] bg-yellow-950/40 shadow-sm' : 'border-yellow-600/50 bg-zinc-800/90')
                              : 'border-zinc-800/50 bg-zinc-950/80'
                          }`}
                        >
                          <div className="flex justify-between items-center">
                            <span className={`text-[11px] font-black ${matchOnDay ? 'text-[#FFF000]' : 'text-zinc-500'}`}>{dayNum}</span>
                            {matchOnDay && <span className="text-[7px] bg-yellow-400/20 text-yellow-300 font-extrabold px-1 rounded">{matchOnDay.comp}</span>}
                          </div>

                          {matchOnDay ? (
                            <div className="mt-0.5">
                              <p className="text-[9px] font-bold text-white truncate leading-tight">
                                {matchOnDay.isHome ? 'vs ' : '@ '}{matchOnDay.opponent.split(' ')[0]}
                              </p>
                              <div className="mt-0.5">
                                {isSpectating ? (
                                  <span className="text-[8px] reysol-bg-yellow text-black font-black px-1 rounded flex items-center justify-center shadow">
                                    🟡 観戦
                                  </span>
                                ) : (
                                  <span className="text-[8px] text-zinc-600 block text-center">-</span>
                                )}
                              </div>
                            </div>
                          ) : <div></div>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* --- ② 「日程・結果」専用ページ (2026年〜2027年全日程 縦スクロール) --- */}
            {currentTab === 'schedule' && (
              <div>
                <h2 className="text-sm font-black text-white mb-3 flex items-center">
                  <i className="fa-solid fa-list-check text-[#FFF000] mr-2"></i>大会別 全日程・結果・トーナメント
                </h2>

                <div className="flex space-x-1 mb-4 overflow-x-auto pb-1 text-xs">
                  {[
                    { id: 'J1', label: 'J1リーグ' },
                    { id: 'LEAGUE_CUP', label: 'ルヴァン杯🏆' },
                    { id: 'EMPEROR_CUP', label: '天皇杯🏆' },
                    { id: 'ACLE', label: 'ACLE🌏' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setSelectedScheduleComp(tab.id)}
                      className={`px-3.5 py-1.5 rounded-full font-black whitespace-nowrap transition-all ${
                        selectedScheduleComp === tab.id 
                          ? 'reysol-bg-yellow text-black shadow-md' 
                          : 'bg-zinc-900 text-zinc-400 border border-zinc-800'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                {/* 🏆 ルヴァン杯 トーナメント表 */}
                {selectedScheduleComp === 'LEAGUE_CUP' && (
                  <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3.5 mb-4 shadow-xl">
                    <h3 className="text-xs font-black text-[#FFF000] mb-3 flex items-center">
                      <i className="fa-solid fa-trophy mr-1.5"></i>2026/27 ルヴァンカップ 勝ち上がり状況
                    </h3>
                    <div className="space-y-2.5 text-xs">
                      <div className="bg-zinc-800/80 p-3 rounded-xl border border-yellow-500/40">
                        <span className="text-[10px] text-zinc-400 font-bold block mb-1">1stラウンド 4回戦（10/3 試合終了）</span>
                        <div className="flex justify-between items-center text-white font-black text-sm">
                          <span>柏レイソル</span>
                          <span className="text-[#FFF000]">5 - 4 (延長)</span>
                          <span>ガンバ大阪</span>
                        </div>
                        <span className="text-[10px] text-green-400 block text-right font-black mt-1">柏レイソル プレーオフステージ突破！🎉</span>
                      </div>
                    </div>
                  </div>
                )}

                {/* 🏆 天皇杯 トーナメント表 */}
                {selectedScheduleComp === 'EMPEROR_CUP' && (
                  <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3.5 mb-4 shadow-xl">
                    <h3 className="text-xs font-black text-[#FFF000] mb-3 flex items-center">
                      <i className="fa-solid fa-crown mr-1.5"></i>第106回 天皇杯 勝ち上がり状況
                    </h3>
                    <div className="space-y-2 text-xs">
                      <div className="bg-zinc-800/60 p-2.5 rounded-xl">
                        <span className="text-[10px] text-zinc-400 block mb-1">3回戦（9/23 試合終了）</span>
                        <div className="flex justify-between font-black text-white">
                          <span>柏レイソル</span>
                          <span className="text-[#FFF000]">4 - 0</span>
                          <span>FC今治</span>
                        </div>
                      </div>
                      <div className="bg-zinc-800/60 p-2.5 rounded-xl border-l-4 border-[#FFF000]">
                        <span className="text-[10px] text-zinc-400 block mb-1">4回戦 (12/09 18:00 予定)</span>
                        <div className="flex justify-between font-black text-white">
                          <span>柏レイソル</span>
                          <span className="text-[#FFF000]">vs</span>
                          <span>ファジアーノ岡山</span>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 2026年〜2027年 全試合日程・結果一覧 */}
                <div className="space-y-2.5">
                  <h3 className="text-xs font-black text-zinc-400">
                    [{selectedScheduleComp}] 2026-2027全日程・結果（タップで試合詳細を表示）
                  </h3>
                  {season2026FullMatches
                    .filter(m => m.comp === selectedScheduleComp)
                    .map(match => {
                      const isSpectating = spectateMatchIds.includes(match.id);
                      const isExpanded = expandedMatchId === match.id;

                      return (
                        <div
                          key={match.id}
                          onClick={() => toggleMatchExpand(match.id)}
                          className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3.5 shadow-lg cursor-pointer transition-all hover:border-yellow-500/50"
                        >
                          <div className="flex justify-between items-center text-xs text-zinc-400 mb-1.5">
                            <span className="font-black text-[#FFF000]">[{match.comp}] {match.date} {match.time}</span>
                            <span className="text-[11px]">📍 {match.stadium}</span>
                          </div>

                          <div className="flex justify-between items-center my-1.5">
                            <div className="flex-1 text-center font-black text-white text-sm">
                              {match.isHome ? '柏レイソル' : match.opponent}
                            </div>
                            <div className="px-3 py-1 bg-black rounded-xl border border-zinc-800 text-center shadow-inner">
                              <span className="text-base font-black text-[#FFF000]">{match.score}</span>
                            </div>
                            <div className="flex-1 text-center font-black text-white text-sm">
                              {match.isHome ? match.opponent : '柏レイソル'}
                            </div>
                          </div>

                          {isExpanded && match.details && (
                            <div className="mt-3 pt-3 border-t border-zinc-800/80 bg-black/50 rounded-xl p-3 text-xs space-y-2">
                              <p className="text-[11px] font-bold text-yellow-300">【{match.details.round}】</p>
                              <p className="text-zinc-300 leading-relaxed">{match.details.summary}</p>
                              
                              {match.details.goalsHome.length > 0 && (
                                <div>
                                  <span className="font-bold text-zinc-400 block mb-0.5">⚽ 得点経過（柏レイソル）:</span>
                                  <ul className="list-disc list-inside text-zinc-200 space-y-0.5">
                                    {match.details.goalsHome.map((g, i) => <li key={i}>{g}</li>)}
                                  </ul>
                                </div>
                              )}
                            </div>
                          )}

                          <div className="flex justify-between items-center mt-2.5 pt-2 border-t border-zinc-800 text-xs">
                            <span className="text-zinc-500 text-[10px]">
                              <i className={`fa-solid ${isExpanded ? 'fa-chevron-up' : 'fa-chevron-down'} mr-1`}></i>
                              {isExpanded ? '詳細を閉じる' : 'タップで試合内容表示'}
                            </span>
                            <button
                              onClick={(e) => toggleSpectate(match.id, e)}
                              className={`px-3 py-1 rounded-lg font-black text-xs flex items-center space-x-1.5 transition-all ${
                                isSpectating 
                                  ? 'reysol-bg-yellow text-black shadow-md' 
                                  : 'bg-zinc-800 text-zinc-400 border border-zinc-700'
                              }`}
                            >
                              <i className={`fa-solid ${isSpectating ? 'fa-eye' : 'fa-eye-slash'}`}></i>
                              <span>{isSpectating ? '🟡 観戦する' : '観戦に追加'}</span>
                            </button>
                          </div>
                        </div>
                      );
                    })}
                </div>
              </div>
            )}

            {/* --- ③ 掲示板 --- */}
            {currentTab === 'board' && (
              <div>
                <h2 className="text-sm font-black text-white mb-2 flex items-center">
                  <i className="fa-solid fa-comments text-[#FFF000] mr-2"></i>Nemo柏レイソル！サポーター掲示板
                </h2>

                <form onSubmit={handlePostSubmit} className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3.5 mb-4 shadow-lg">
                  <input
                    type="text"
                    placeholder="ニックネーム (任意)"
                    value={inputName}
                    onChange={(e) => setInputName(e.target.value)}
                    className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white mb-2 focus:outline-none focus:border-[#FFF000]"
                  />
                  <textarea
                    rows="3"
                    placeholder="Nemo柏レイソル！で熱く語ろう！(本日の名古屋戦や観戦コメントなど)"
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    className="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-xs text-white mb-2 focus:outline-none focus:border-[#FFF000]"
                  ></textarea>
                  <button type="submit" className="w-full reysol-bg-yellow text-black font-black py-2 rounded-xl text-xs shadow-md">
                    投稿する
                  </button>
                </form>

                <div className="space-y-2">
                  {posts.map(post => (
                    <div key={post.id} className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3">
                      <div className="flex justify-between items-center text-xs mb-1">
                        <span className="font-bold text-[#FFF000]">{post.name}</span>
                        <span className="text-zinc-500">{post.time}</span>
                      </div>
                      <p className="text-xs text-zinc-200 leading-relaxed">{post.text}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* --- ④ 選手一覧 (全43名完全網羅) --- */}
            {currentTab === 'players' && (
              <div>
                <h2 className="text-sm font-black text-white mb-3">2026/27 柏レイソル 全所属選手 ({allReysolPlayers.length}名)</h2>
                <div className="grid grid-cols-2 gap-2">
                  {allReysolPlayers.map((p, idx) => (
                    <div key={idx} className="bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 flex items-center space-x-2.5">
                      <div className="w-8 h-8 rounded-full reysol-bg-yellow text-black font-black flex items-center justify-center text-xs flex-shrink-0 shadow">
                        {p.number}
                      </div>
                      <div className="overflow-hidden">
                        <p className="text-xs font-bold text-white truncate">{p.name}</p>
                        <p className="text-[10px] text-zinc-400">{p.pos}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* ボトムナビゲーション */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-black/95 backdrop-blur-md border-t border-zinc-800/80 flex justify-around items-center py-2.5 z-50">
            <button onClick={() => setCurrentTab('calendar')} className={`flex flex-col items-center space-y-1 ${currentTab === 'calendar' ? 'text-[#FFF000]' : 'text-zinc-500'}`}>
              <i className="fa-solid fa-calendar-days text-base"></i>
              <span className="text-[10px] font-bold">カレンダー</span>
            </button>
            <button onClick={() => setCurrentTab('schedule')} className={`flex flex-col items-center space-y-1 ${currentTab === 'schedule' ? 'text-[#FFF000]' : 'text-zinc-500'}`}>
              <i className="fa-solid fa-list-check text-base"></i>
              <span className="text-[10px] font-bold">日程・結果</span>
            </button>
            <button onClick={() => setCurrentTab('board')} className={`flex flex-col items-center space-y-1 ${currentTab === 'board' ? 'text-[#FFF000]' : 'text-zinc-500'}`}>
              <i className="fa-solid fa-comments text-base"></i>
              <span className="text-[10px] font-bold">掲示板</span>
            </button>
            <button onClick={() => setCurrentTab('players')} className={`flex flex-col items-center space-y-1 ${currentTab === 'players' ? 'text-[#FFF000]' : 'text-zinc-500'}`}>
              <i className="fa-solid fa-user-group text-base"></i>
              <span className="text-[10px] font-bold">選手</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
