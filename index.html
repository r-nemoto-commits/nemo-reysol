    function init() {
      let savedAtt = {};
      try {
        savedAtt = JSON.parse(localStorage.getItem('nemo_reysol_attendance_keys') || '{}');
      } catch (e) {
        console.error('観戦予定の読み込みに失敗しました', e);
      }
      matches.forEach(m => {
        if (savedAtt[m.matchKey] !== undefined) {
          m.attendance = savedAtt[m.matchKey];
        }
      });

      renderCalendar();
      renderSchedule('Jリーグ');
      renderPlayers();
      loadStoredPhotos();

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
      } else if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
      }
      renderCalendar();
    }

    function renderCalendar() {
      document.getElementById('calendar-title').innerText = `${currentYear}年 ${currentMonth}月`;
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const today = new Date();
      const isCurrentMonth = today.getFullYear() === currentYear && today.getMonth() + 1 === currentMonth;

      const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div></div>`;
      }

      for (let i = 1; i <= daysInMonth; i++) {
        const dateStr = `${String(currentMonth).padStart(2, '0')}/${String(i).padStart(2, '0')}`;
        const match = matches.find(m => m.year === currentYear && m.month === currentMonth && m.date === dateStr);
        const hasMatch = !!match;
        const isToday = isCurrentMonth && today.getDate() === i;

        let bgColor = 'bg-white';
        let matchInfo = '';

        if (hasMatch) {
          bgColor = match.result === 'Win' ? 'bg-red-50 border-red-300' : (match.result === 'Loss' ? 'bg-blue-50 border-blue-300' : (match.result === 'Draw' ? 'bg-gray-100 border-gray-300' : 'bg-yellow-100 border-yellow-400'));

          let attBadge = '';
          if (match.attendance === 1) attBadge = `<div class="text-[7px] font-black bg-blue-500 text-white rounded px-0.5 mt-0.5">🚗予定</div>`;
          if (match.attendance === 2) attBadge = `<div class="text-[7px] font-black bg-[#FFF100] text-black rounded px-0.5 mt-0.5 border border-black">🏟️観戦済</div>`;

          matchInfo = `
            <div class="mt-0.5 leading-tight w-full px-0.5">
              <div class="text-[7px] font-black bg-black text-[#FFF100] rounded px-0.5">${match.category}</div>
              <div class="text-[8px] font-bold text-gray-700 truncate mt-0.5">${match.shortOpp}</div>
              <div class="text-[9px] font-black text-black">${match.score}</div>
              ${attBadge}
            </div>
          `;
        }

        const todayRing = isToday ? 'ring-2 ring-[#FFF100] ring-offset-1' : '';

        grid.innerHTML += `
          <div class="relative py-1 px-0.5 rounded border border-gray-200 ${bgColor} ${todayRing} min-h-[64px] flex flex-col items-center shadow-xs">
            ${isToday ? '<span class="absolute -top-1.5 -right-1.5 bg-black text-[#FFF100] text-[6px] font-black px-1 py-0.5 rounded-full border border-[#FFF100] shadow">今日</span>' : ''}
            <span class="text-xs font-bold ${isToday ? 'text-black' : 'text-gray-700'}">${i}</span>
            ${matchInfo}
          </div>
        `;
      }
    }

    function renderSchedule(category) {
      const cats = ['Jリーグ', 'ルヴァン杯', '天皇杯', 'ACLE'];
      cats.forEach(c => {
        const btn = document.getElementById(`btn-cat-${c}`);
        btn.className = (c === category)
          ? 'flex-1 py-1.5 rounded-md bg-[#FFF100] shadow-sm text-black font-black'
          : 'flex-1 py-1.5 rounded-md text-gray-400 font-bold';
      });

      const bracket = document.getElementById('tournament-bracket');
      if (category === 'ルヴァン杯' || category === '天皇杯') {
        bracket.classList.remove('hidden');
        document.getElementById('bracket-title').innerText = `${category} トーナメント状況`;
      } else {
        bracket.classList.add('hidden');
      }

      const container = document.getElementById('match-list');
      const filteredMatches = matches.filter(m => m.category === category);

      if (filteredMatches.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-gray-400 text-sm font-bold">この大会の登録試合はありません</div>`;
        return;
      }

      container.innerHTML = filteredMatches.map(m => {
        let badgeColor = m.result === 'Win' ? 'bg-red-500 text-white' : (m.result === 'Loss' ? 'bg-blue-600 text-white' : (m.result === 'Draw' ? 'bg-gray-400 text-white' : 'bg-gray-200 text-gray-700'));
        let status = m.result === 'Win' ? '勝利' : (m.result === 'Loss' ? '敗戦' : (m.result === 'Draw' ? '引き分け' : '予定'));
        let scoreClass = m.result === 'Upcoming' ? 'text-lg text-gray-500 font-medium' : 'text-2xl font-black text-black tracking-widest';
        
        let attText = "未観戦"; let attColor = "bg-gray-100 text-gray-400 border-gray-200"; let attIcon = "fa-minus";
        if (m.attendance === 1) { attText = "行く予定🚗"; attColor = "bg-blue-50 text-blue-600 border-blue-300 font-bold"; attIcon = "fa-car"; }
        if (m.attendance === 2) { attText = "現地観戦！🏟️"; attColor = "bg-[#FFF100] text-black border-yellow-500 font-black"; attIcon = "fa-stadium"; }

        return `
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-[#FFF100] p-3 relative">
            <div class="flex justify-between items-center border-b border-gray-100 pb-2 mb-2">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-gray-600">${m.year}/${m.date}(${m.day}) ${m.type}</span>
                <span class="text-[10px] bg-yellow-50 text-yellow-800 px-1.5 py-0.5 rounded border border-yellow-200 font-bold">時点順位: ${m.rank}</span>
              </div>
              <span class="text-[10px] px-2 py-0.5 rounded font-bold ${badgeColor}">${status}</span>
            </div>
            
            <div class="flex justify-between items-center mb-3">
              <div class="text-center w-[30%]"><p class="font-black text-sm text-black">柏レイソル</p><p class="text-[9px] text-gray-400 mt-0.5">${m.ha === 'Home' ? 'HOME' : 'AWAY'}</p></div>
              <div class="text-center w-[30%] bg-gray-50 rounded py-1"><span class="${scoreClass}">${m.score}</span></div>
              <div class="text-center w-[30%]"><p class="font-bold text-sm text-gray-800 leading-tight">${m.opponent}</p></div>
            </div>

            <button onclick="toggleAttendance('${m.matchKey}', '${category}')" class="w-full py-1.5 rounded-lg text-xs flex justify-center items-center gap-1 border transition-colors ${attColor}">
              <i class="fa-solid ${attIcon}"></i> ${attText}
            </button>
          </div>
        `;
      }).join('');
    }

    function toggleAttendance(matchKey, currentCategory) {
      const match = matches.find(m => m.matchKey === matchKey);
      if (!match) return;

      match.attendance = (match.attendance + 1) % 3;

      try {
        let savedAtt = JSON.parse(localStorage.getItem('nemo_reysol_attendance_keys') || '{}');
        savedAtt[matchKey] = match.attendance;
        localStorage.setItem('nemo_reysol_attendance_keys', JSON.stringify(savedAtt));
      } catch (e) {
        console.error('観戦予定の保存に失敗しました', e);
        alert('保存に失敗しました（ブラウザのプライベートモードでは保存できません）。');
      }

      renderSchedule(currentCategory);
      renderCalendar();
    }

    // 写真の保存先（IndexedDB）：localStorageは容量が小さく、
    // 写真を入れると上限を超えて書き込みが失敗し、観戦予定の保存まで巻き添えで失敗していたため移行
    const PHOTO_DB_NAME = 'nemoReysolDB';
    const PHOTO_STORE = 'photos';

    function openPhotoDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(PHOTO_DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(PHOTO_STORE)) {
            db.createObjectStore(PHOTO_STORE, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function addPhotoToDB(dataUrl) {
      const db = await openPhotoDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PHOTO_STORE, 'readwrite');
        tx.objectStore(PHOTO_STORE).add({ dataUrl, ts: Date.now() });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getAllPhotosFromDB() {
      const db = await openPhotoDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PHOTO_STORE, 'readonly');
        const req = tx.objectStore(PHOTO_STORE).getAll();
        req.onsuccess = () => resolve(req.result.sort((a, b) => b.ts - a.ts));
        req.onerror = () => reject(req.error);
      });
    }

    // 以前localStorageに保存されていた写真があれば一度だけIndexedDBへ引き継ぐ
    async function migrateLegacyPhotos() {
      let legacy;
      try {
        legacy = localStorage.getItem('nemo_reysol_photos');
      } catch (e) { return; }
      if (!legacy) return;
      try {
        const arr = JSON.parse(legacy);
        for (const dataUrl of arr) {
          await addPhotoToDB(dataUrl);
        }
      } catch (e) {
        console.error('写真の引き継ぎに失敗しました', e);
      }
      try { localStorage.removeItem('nemo_reysol_photos'); } catch (e) {}
    }

    // スマホの写真は数MBあるため、保存前に縮小・圧縮してから保存する
    function compressImage(file, maxDim = 1600, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(reader.error);
        reader.onload = e => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
              else { width = Math.round(width * maxDim / height); height = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // 複数画像一括アップロード処理
    async function postPhoto() {
      const input = document.getElementById('upload-image');
      if (!input.files || input.files.length === 0) {
        alert("写真を選択してください！");
        return;
      }

      const files = Array.from(input.files);
      let successCount = 0;

      for (const file of files) {
        try {
          const compressed = await compressImage(file);
          await addPhotoToDB(compressed);
          renderGalleryImage(compressed, true);
          successCount++;
        } catch (err) {
          console.error('写真の保存に失敗しました', err);
          alert("写真の保存に失敗しました。容量不足などの可能性があります。");
        }
      }

      input.value = "";
      if (successCount > 0) {
        alert(`${successCount}枚の写真をギャラリーに追加しました！`);
      }
    }

    async function loadStoredPhotos() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';
      const samplePhotos = [
        "https://placehold.co/300x300/FFF100/000?text=Rey-kun+1",
        "https://placehold.co/300x300/111111/FFF?text=Stadium",
        "https://placehold.co/300x300/FFF/000?text=Goal+Scene"
      ];

      await migrateLegacyPhotos();

      let storedPhotos = [];
      try {
        storedPhotos = await getAllPhotosFromDB();
      } catch (e) {
        console.error('写真の読み込みに失敗しました', e);
      }

      storedPhotos.forEach(p => renderGalleryImage(p.dataUrl, false));
      samplePhotos.forEach(src => renderGalleryImage(src, false));
    }

    function renderGalleryImage(src, prepend = false) {
      const grid = document.getElementById('gallery-grid');
      const img = document.createElement('img');
      img.src = src;
      img.className = "rounded-lg shadow-sm w-full object-cover aspect-square";
      if (prepend) { grid.prepend(img); } else { grid.appendChild(img); }
    }

    function renderPlayers() {
      const container = document.getElementById('player-list');
      container.innerHTML = players.map(p => `
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-2 flex items-center gap-2">
          <div class="w-8 h-8 bg-black rounded-full flex items-center justify-center font-black text-xs border-2 border-[#FFF100] shrink-0 text-[#FFF100]">${p.no}</div>
          <div class="truncate"><p class="text-[8px] text-gray-400 font-bold">${p.pos}</p><p class="font-black text-xs text-black leading-tight truncate">${p.name}</p></div>
        </div>
      `).join('');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('sec-' + tabId).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-[#FFF100]', 'font-bold');
        btn.classList.add('text-gray-500');
      });
      document.getElementById('tab-' + tabId).classList.add('text-[#FFF100]', 'font-bold');
      document.getElementById('tab-' + tabId).classList.remove('text-gray-500');
      window.scrollTo(0, 0);
    }

    window.addEventListener('DOMContentLoaded', init);
