<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nemo柏レイソル！</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }
    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-20">

  <header class="bg-[#FFF100] text-black font-black p-4 shadow-md flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <img src="photo.jpg" alt="Nemo" class="w-11 h-11 rounded-full object-cover border-2 border-black bg-white shadow-sm" onerror="this.src='https://placehold.co/100x100/000/FFF?text=Nemo'">
      <h1 class="text-xl tracking-wider">Nemo柏レイソル</h1>
    </div>
    <div class="text-[10px] bg-black text-white px-2 py-1 rounded-full flex items-center gap-1 shadow-inner">
      <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>自動更新
    </div>
  </header>

  <main class="max-w-xl mx-auto w-full mt-4">
    <section id="sec-schedule" class="tab-content active px-4">
      <h2 class="font-black text-lg border-l-4 border-yellow-400 pl-2 mb-4">試合日程・最新結果</h2>
      <div id="match-list" class="space-y-3"></div>
    </section>

    <section id="sec-roster" class="tab-content px-4">
      <h2 class="font-black text-lg border-l-4 border-yellow-400 pl-2 mb-4">選手名鑑 <span class="text-xs font-normal text-gray-500">(背番号順)</span></h2>
      <div id="player-list" class="grid grid-cols-2 gap-3"></div>
    </section>

    <section id="sec-calendar" class="tab-content px-4">
      <h2 class="font-black text-lg border-l-4 border-yellow-400 pl-2 mb-4">試合カレンダー</h2>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-4">
          <button class="text-gray-400 px-3 py-1 bg-gray-50 rounded-lg">&lt;</button>
          <h3 class="font-black text-lg">2026年 10月</h3>
          <button class="text-gray-400 px-3 py-1 bg-gray-50 rounded-lg">&gt;</button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-gray-400 mb-2">
          <div class="text-red-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-500">土</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-2 text-center text-lg"></div>
      </div>
    </section>

    <section id="sec-gallery" class="tab-content px-4">
      <h2 class="font-black text-lg border-l-4 border-yellow-400 pl-2 mb-4">フォトギャラリー</h2>
      <div class="grid grid-cols-2 gap-2">
        <img src="https://placehold.co/300x300/FFF100/000?text=Rey-kun+1" class="rounded-lg shadow-sm w-full object-cover aspect-square">
        <img src="https://placehold.co/300x300/111111/FFF?text=Stadium" class="rounded-lg shadow-sm w-full object-cover aspect-square">
        <img src="https://placehold.co/300x300/FFF/000?text=Goal+Scene" class="rounded-lg shadow-sm w-full object-cover aspect-square">
        <img src="https://placehold.co/300x300/FFF100/000?text=Rey-kun+2" class="rounded-lg shadow-sm w-full object-cover aspect-square">
      </div>
    </section>

    <section id="sec-board" class="tab-content px-4">
      <h2 class="font-black text-lg border-l-4 border-yellow-400 pl-2 mb-4">サポーター掲示板</h2>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-4">
        <div class="border-b pb-3">
          <div class="flex justify-between text-xs text-gray-500 mb-1">
            <span class="font-bold text-yellow-600">Nemo</span><span>10/17 21:30</span>
          </div>
          <p class="text-sm font-medium">名古屋戦悔しい！次は絶対に勝つぞ！</p>
        </div>
        <div class="border-b pb-3">
          <div class="flex justify-between text-xs text-gray-500 mb-1">
            <span class="font-bold text-yellow-600">Nemo</span><span>10/14 22:00</span>
          </div>
          <p class="text-sm font-medium">ACLE ポートFC戦 5-1の大勝最高！！</p>
        </div>
      </div>
    </section>
  </main>

  <div id="date-info-modal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300" id="modal-content">
      <div class="bg-[#FFF100] p-4 flex justify-between items-center border-b-2 border-black">
        <h4 id="date-info-title" class="font-black text-lg text-black"></h4>
        <button onclick="closeModal()" class="text-black bg-white rounded-full w-8 h-8 flex items-center justify-center font-bold shadow"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="date-info-desc" class="p-6 bg-gray-50"></div>
    </div>
  </div>

  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-between px-2 py-2 z-50 max-w-xl mx-auto shadow-[0_-5px_15px_rgba(0,0,0,0.05)] pb-safe">
    <button onclick="switchTab('schedule')" id="tab-schedule" class="nav-btn flex flex-col items-center w-1/5 text-yellow-600 font-bold">
      <i class="fa-solid fa-futbol text-xl mb-1"></i><span class="text-[9px]">日程・結果</span>
    </button>
    <button onclick="switchTab('roster')" id="tab-roster" class="nav-btn flex flex-col items-center w-1/5 text-gray-400">
      <i class="fa-solid fa-users text-xl mb-1"></i><span class="text-[9px]">選手名鑑</span>
    </button>
    <button onclick="switchTab('calendar')" id="tab-calendar" class="nav-btn flex flex-col items-center w-1/5 text-gray-400">
      <i class="fa-solid fa-calendar-days text-xl mb-1"></i><span class="text-[9px]">カレンダー</span>
    </button>
    <button onclick="switchTab('gallery')" id="tab-gallery" class="nav-btn flex flex-col items-center w-1/5 text-gray-400">
      <i class="fa-solid fa-camera text-xl mb-1"></i><span class="text-[9px]">ギャラリー</span>
    </button>
    <button onclick="switchTab('board')" id="tab-board" class="nav-btn flex flex-col items-center w-1/5 text-gray-400">
      <i class="fa-solid fa-comments text-xl mb-1"></i><span class="text-[9px]">掲示板</span>
    </button>
