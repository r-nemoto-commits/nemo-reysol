    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      let html = '';
      for(let i=0; i<4; i++) { html += `<div></div>`; }
      
      for(let i=1; i<=31; i++) {
        const dateStr = `10/${String(i).padStart(2, '0')}`;
        const match = matches.find(m => m.date === dateStr);
        const hasMatch = !!match;
        
        let bgColor = 'bg-white';
        let matchInfo = '';

        if (hasMatch) {
          bgColor = match.result === 'Win' ? 'bg-red-50 border-red-300' : (match.result === 'Loss' ? 'bg-blue-50 border-blue-300' : 'bg-yellow-100 border-yellow-400');
          matchInfo = `
            <div class="mt-0.5 leading-tight w-full px-0.5">
              <div class="text-[7px] font-black bg-black text-white rounded px-0.5">${match.category}</div>
              <div class="text-[8px] font-bold text-gray-700 truncate mt-0.5">${match.shortOpp}</div>
              <div class="text-[9px] font-black text-black">${match.score}</div>
            </div>
          `;
        }

        html += `
          <div class="py-1 px-0.5 rounded border border-gray-200 ${bgColor} min-h-[60px] flex flex-col items-center shadow-xs">
            <span class="text-xs font-bold text-gray-700">${i}</span>
            ${matchInfo}
          </div>
        `;
      }
      grid.innerHTML = html;
    }

    function renderSchedule(category) {

          ? 'flex-1 py-1.5 rounded-md bg-white shadow-sm text-black font-black' 
          : 'flex-1 py-1.5 rounded-md text-gray-500 font-bold';
      });

      const bracket = document.getElementById('tournament-bracket');
      if(category === 'ルヴァン杯' || category === '天皇杯') {
        bracket.classList.remove('hidden');
        document.getElementById('bracket-title').innerText = `${category} トーナメント状況`;
      } else {
        bracket.classList.add('hidden');
      }

      const container = document.getElementById('match-list');
      const filteredMatches = matches.filter(m => m.category === category);

        container.innerHTML = `<div class="text-center py-6 text-gray-400 text-sm font-bold">この大会の登録試合はありません</div>`;
        return;

        let badgeColor = m.result === 'Win' ? 'bg-red-500 text-white' : (m.result === 'Loss' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700');

        let scoreClass = m.result === 'Upcoming' ? 'text-lg text-gray-500 font-medium' : 'text-2xl font-black text-black tracking-widest';

        if(m.attendance === 1) { attText = "行く予定🚗"; attColor = "bg-blue-50 text-blue-600 border-blue-300 font-bold"; attIcon = "fa-car"; }
        if(m.attendance === 2) { attText = "現地観戦！🏟️"; attColor = "bg-[#FFF100] text-black border-yellow-500 font-black"; attIcon = "fa-stadium"; }

          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-3 relative">
            <div class="flex justify-between items-center border-b border-gray-100 pb-2 mb-2">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-gray-600">${m.date}(${m.day}) ${m.type}</span>
                <span class="text-[10px] bg-yellow-50 text-yellow-800 px-1.5 py-0.5 rounded border border-yellow-200 font-bold">時点順位: ${m.rank}</span>
              </div>
              <span class="text-[10px] px-2 py-0.5 rounded font-bold ${badgeColor}">${status}</span>
            </div>
            
            <div class="flex justify-between items-center mb-3">
              <div class="text-center w-[30%]"><p class="font-black text-sm text-black">柏レイソル</p><p class="text-[9px] text-gray-400 mt-0.5">${m.ha === 'Home' ? 'HOME' : 'AWAY'}</p></div>
              <div class="text-center w-[30%] bg-gray-50 rounded py-1"><span class="${scoreClass}">${m.score}</span></div>
              <div class="text-center w-[30%]"><p class="font-bold text-sm text-gray-800 leading-tight">${m.opponent}</p></div>
            </div>

            <button onclick="toggleAttendance(${m.id}, '${category}')" class="w-full py-1.5 rounded-lg text-xs flex justify-center items-center gap-1 border transition-colors ${attColor}">
              <i class="fa-solid ${attIcon}"></i> ${attText}
            </button>
          </div>
        `;
      }).join('');
    }

    function toggleAttendance(matchId, currentCategory) {
      const match = matches.find(m => m.id === matchId);
      match.attendance = (match.attendance + 1) % 3;
      renderSchedule(currentCategory);
    }

    function postPhoto() {
      const input = document.getElementById('upload-image');
      if(input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const grid = document.getElementById('gallery-grid');
          const newImg = document.createElement('img');
          newImg.src = e.target.result;
          newImg.className = "rounded-lg shadow-sm w-full object-cover aspect-square";
          grid.prepend(newImg);
          input.value = "";
          alert("ギャラリーに写真を追加しました！");
        }
        reader.readAsDataURL(input.files[0]);
      } else {
        alert("写真を選択してください！");
      }
    }

    function renderPlayers() {
      const container = document.getElementById('player-list');
      container.innerHTML = players.map(p => `
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-2 flex items-center gap-2">
          <div class="w-8 h-8 bg-gray-50 rounded-full flex items-center justify-center font-black text-xs border-2 border-yellow-400 shrink-0 text-black">${p.no}</div>
          <div class="truncate"><p class="text-[8px] text-gray-400 font-bold">${p.pos}</p><p class="font-black text-xs text-black leading-tight truncate">${p.name}</p></div>
        </div>
      `).join('');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('sec-' + tabId).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-yellow-600', 'font-bold');
        btn.classList.add('text-gray-400');
      });
      document.getElementById('tab-' + tabId).classList.add('text-yellow-600', 'font-bold');
      document.getElementById('tab-' + tabId).classList.remove('text-gray-400');
      window.scrollTo(0, 0);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
